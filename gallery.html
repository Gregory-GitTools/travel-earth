<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фото — Travel Earth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<meta name="theme-color" content="#111">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: #111;
    color: #eee;
    font-family: "Poppins", system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* подпись: название, автор · дата · лицензия (Commons требует указывать), счётчик */
  .bar {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 10px 16px;
  }
  .caption { flex: 1; min-width: 0; }
  .title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 0.78rem; color: #aaa; margin-top: 2px; }
  .meta a { color: #8ab4f8; }
  .count { font-size: 0.85rem; color: #aaa; white-space: nowrap; }

  .stage { position: relative; min-height: 0; }
  .stage img, .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* бейдж LIVE — пассивная подпись сверху справа, не внизу: там теперь одна-единственная кнопка
     разового воспроизведения, два элемента рядом смотрелись как две разные кнопки плей (Грегори,
     2026-10-16: «один значок, или видео, или Live»; «значки плей справа связаны, а не должны»).
     Для обычного видео бейдж вообще не нужен — его состояние и так видно по иконке кнопки снизу.
     [hidden] объявлен отдельным правилом — иначе его проигрывает по специфичности display:flex
     класса ниже, и бейдж никогда не скрывается (Грегори, 2026-10-16: «значок Live не уходит») */
  .stage-badge {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 2;
    border-radius: 12px;
    padding: 4px 10px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font: 600 0.72rem "Poppins", sans-serif;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
  .stage-badge[hidden] { display: none; }

  /* разовое воспроизведение текущего кадра (видео или живое фото) — одна кнопка внизу справа
     (Грегори, 2026-10-16, после попытки слева: «ни одной кнопки слева снизу — я правша»), не
     связанная со слайдшоу альбома: клик тут — play/pause самого ролика, сверху и в панели
     экскурсии — слайдшоу, синхронизированы друг с другом. Отступ снизу больше обычного — чтобы
     не наезжать на встроенную ленту прокрутки видео (controls=true ниже) */
  .play-once {
    position: absolute;
    bottom: 44px;
    right: 14px;
    z-index: 2;
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    cursor: pointer;
  }
  .play-once[hidden] { display: none; }
  .play-once:hover { background: rgba(0, 0, 0, 0.75); }

  /* нативные элементы управления видео возвращены ради ленты прокрутки (Грегори, 2026-10-16:
     «ушла лента прокрутки, которая должна остаться поверх видео») — но свою кнопку play/pause
     внутри них прячем, иначе рядом с .play-once было бы два одинаковых плей-контрола */
  video.photo::-webkit-media-controls-play-button,
  video.photo::-webkit-media-controls-overlay-play-button { display: none !important; }

  .nav {
    position: absolute;
    top: 50%;
    width: 48px;
    height: 48px;
    margin-top: -24px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 28px;
    line-height: 48px;
    cursor: pointer;
  }
  .nav:hover { background: rgba(0, 0, 0, 0.7); }
  .nav:disabled { visibility: hidden; }
  .prev { left: 12px; }
  .next { right: 12px; }

  /* лента миниатюр — как на карте: тонкая рамка у выбранного, ничего не прыгает */
  .thumbs {
    display: flex;
    gap: 2px;
    padding: 6px 16px 10px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
  }
  /* [hidden] объявлен отдельно — тот же приём, что у .stage-badge/.play-once выше: без этого
     display:flex класса всегда побеждал бы спрятанный атрибут (режим F11, см. syncFullscreen) */
  .thumbs[hidden] { display: none; }
  .thumb {
    position: relative;
    flex: none;
    width: 72px;
    height: 72px;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: #222;
    overflow: hidden;
    cursor: pointer;
    opacity: 0.6;
  }
  .thumb:hover, .thumb.active { opacity: 1; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 3px solid transparent;
    border-radius: 6px;
  }
  .thumb.active::after { border-color: #e91e63; }
  /* значок в ленте миниатюр — отдельный ролик (▶) или живое фото (LIVE), чтобы было видно
     без открытия самого снимка (Грегори, 2026-10-14: «просмотр видео форматов... живых фото») */
  .thumb-badge {
    position: absolute;
    bottom: 3px;
    right: 3px;
    color: #fff;
    font-size: 0.6rem;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  .empty { display: grid; place-items: center; color: #aaa; }

  /* экскурсия (текст из папки альбома): панель справа; подпись снимка — под названием */
  .main { display: flex; min-height: 0; }
  .main .stage { flex: 1; }
  .tour {
    width: 360px;
    padding: 12px 18px 24px;
    overflow-y: auto;
    border-left: 1px solid #2a2a2a;
    font-size: 0.88rem;
    line-height: 1.5;
    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
  }
  .tour h2 { margin: 0 0 10px; font-size: 1.05rem; font-weight: 600; }
  .tour h3 { margin: 18px 0 6px; font-size: 0.92rem; font-weight: 600; color: #fff; }
  .tour p { margin: 0 0 10px; color: #ccc; }
  .tour .stop {
    display: flex;
    gap: 10px;
    width: 100%;
    margin: 0 0 10px;
    padding: 6px;
    border: none;
    border-radius: 8px;
    background: #1c1c1c;
    color: #ddd;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tour .stop:hover { background: #262626; }
  .tour .stop.current { outline: 2px solid #e91e63; }
  .tour .stop img { flex: none; width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: #222; }
  .tour-toggle {
    border: 1px solid #444;
    border-radius: 14px;
    padding: 3px 12px;
    background: transparent;
    color: #ddd;
    font: inherit;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .tour-toggle.on { background: #333; }
  /* плеер слайд-шоу: та же пилюля, что у переключателя «Экскурсия» (Грегори, 2026-10-11
     продолжение: «после клика на альбом должно появляться новое окно с одним альбомом и
     плейером для слайдшоу») — автосмена снимков каждые 5 с, пока нажата */
  .play-toggle { min-width: 34px; text-align: center; }
  .play-toggle.on { background: #e91e63; }
  .caption-text { font-size: 0.85rem; color: #ddd; font-style: italic; margin-top: 4px; }

  /* плеер своего альбома — те же кнопки назад/плей/дальше/стоп, что и на панели альбома в
     главном окне (.tour-player/.tour-edit там), в правом верхнем углу шапки плеера (Грегори,
     2026-10-16: «кнопки расположи в правом верхнем углу... должны повторять кнопки в панели
     альбома»). Счётчик — отдельной строкой НАД кнопками, не дублируется текстом внутри плеера
     (Грегори, 2026-10-16: «дублируется количество кадров, оставь отдельной строкой выше») */
  .player-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; align-self: center; }
  .player { display: flex; align-items: center; gap: 2px; }
  .player-btn {
    display: inline-grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: #ddd;
    cursor: pointer;
  }
  .player-btn:hover { background: rgba(255, 255, 255, 0.12); }
  .player-btn:disabled { opacity: 0.35; cursor: default; background: transparent; }
  .player-btn.on { background: #6ab4ff; color: #111; }

  /* переход между кадрами слайдшоу — перетекание (View Transitions API сам крест-фейдит документ
     целиком, без второго элемента-дубля); длительность длиннее дефолтных 0.25 с (Грегори,
     2026-10-16: «сделай переходы между фото с перетеканием») */
  ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.6s; }

  /* как в index.html: открытое из установленного приложения окно тоже без системного заголовка
     (window-controls-overlay наследуется дочерними окнами того же PWA) — без этой полоски его
     было нечем перетащить на другой монитор (Грегори, 2026-10-11: «окно альбома не сдвинуть») */
  .titlebar-drag { display: none; }
  @media (display-mode: window-controls-overlay) {
    .titlebar-drag {
      display: block;
      position: fixed;
      left: env(titlebar-area-x, 0);
      top: env(titlebar-area-y, 0);
      width: env(titlebar-area-width, 100%);
      height: env(titlebar-area-height, 33px);
      app-region: drag;
      -webkit-app-region: drag;
      z-index: 20;
    }
    body { padding-top: env(titlebar-area-height, 33px); }
  }
</style>
</head>
<body>
<div class="titlebar-drag"></div>
<div class="bar">
  <div class="caption"><div class="title"></div><div class="meta"></div><div class="caption-text" hidden></div></div>
  <button class="tour-toggle" hidden>Экскурсия</button>
  <button class="tour-toggle play-toggle" title="Слайд-шоу: смена каждые 5 с">▶</button>
  <div class="player-wrap">
    <div class="count"></div>
    <div class="player" hidden>
      <button class="player-btn player-prev" title="Назад"></button>
      <button class="player-btn player-play" title="Слайдшоу альбома"></button>
      <button class="player-btn player-next" title="Дальше"></button>
      <button class="player-btn player-stop" title="Стоп"></button>
    </div>
  </div>
</div>
<div class="main">
  <div class="stage">
    <img class="photo" alt="">
    <video class="photo" playsinline hidden></video>
    <span class="stage-badge" hidden>LIVE</span>
    <button class="play-once" hidden title="Воспроизвести"></button>
    <button class="nav prev" title="Назад (←)">‹</button>
    <button class="nav next" title="Вперёд (→)">›</button>
  </div>
  <div class="tour" hidden></div>
</div>
<div class="thumbs"></div>
<script>
// Галерея снимков ленты: список кладёт app.js в localStorage ("travel-earth.gallery") перед
// открытием окна; текущий снимок выделяется на карте в главном окне. ← → — листать, Home/End — к первому/последнему, Esc — закрыть окно
const data = JSON.parse(localStorage.getItem("travel-earth.gallery") || "null") || { photos: [], start: 0 };
const photos = data.photos;
// альбом — чтобы свои кнопки плеера сверху могли звать плей/пауза/назад/дальше/стоп напрямую
// в главном окне (window.opener), как в панели альбома (Грегори, 2026-10-16: «кнопки должны
// повторять кнопки в панели альбома»)
const albumId = data.albumId || null;
let index = Math.min(Math.max(0, data.start || 0), photos.length - 1);
const $ = (sel) => document.querySelector(sel);
// снимок и ролик — отдельные теги с одним классом .photo (позиционирование общее в CSS),
// поэтому сами ссылки берём по тегу, а не по классу
const photoEl = document.querySelector("img.photo");
const videoEl = document.querySelector("video.photo");
const stageBadge = $(".stage-badge");
const playOnceBtn = $(".play-once");
// плеер слайд-шоу — автосмена каждые 5 с, пока нажата кнопка; любая навигация (ручная или
// автоматическая) переставляет таймер, чтобы темп не сбивался
let playTimer = null;
// перетекание между кадрами — View Transitions API сам крест-фейдит документ до/после fn();
// без него (старые браузеры) — просто мгновенная смена, без анимации
function withTransition(fn) {
  if (document.startViewTransition) document.startViewTransition(fn);
  else fn();
}

// крупный снимок: у Commons миниатюры стандартных размеров; оригинал — если он не больше 1920
const bigUrl = (p) => (p.fullWidth > 1920 && p.thumb ? p.thumb.replace(/\/\d+px-/, "/1920px-") : p.full || p.thumb);

// свои фото (альбом с компьютера): файлы читает главное окно — миниатюру делает, когда её
// клетка ленты видна (по одной, чтобы не вешать браузер), оригинал отдаёт только открытому
const host = () => {
  try { return [window.opener, window.parent].find((w) => w && w !== window && w.myGalleryThumb) || null; } catch { return null; }
};
const thumbQueue = [];
let thumbBusy = false;
// клетка ещё рядом с видимой частью ленты? (пока ждала очереди, ленту могли прокрутить)
function nearView(el) {
  const r = el.getBoundingClientRect(), root = document.querySelector(".thumbs").getBoundingClientRect();
  return r.right > root.left - 400 && r.left < root.right + 400;
}
function pumpThumbs() {
  if (thumbBusy || !host()) return;
  while (thumbQueue.length && !nearView(thumbQueue[0][1].parentElement)) seen.observe(thumbQueue.shift()[1].parentElement);
  if (!thumbQueue.length) return;
  thumbBusy = true;
  const [p, img] = thumbQueue.shift();
  host().myGalleryThumb(p.photo).then((url) => { p.thumb = url; img.src = url; }).catch(() => {})
    .finally(() => { thumbBusy = false; pumpThumbs(); });
}
const seen = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    seen.unobserve(e.target);
    const i = Number(e.target.dataset.i);
    thumbQueue.push([photos[i], e.target.firstChild]);
  }
  pumpThumbs();
}, { root: document.querySelector(".thumbs"), rootMargin: "0px 400px" });

const thumbs = photos.map((p, i) => {
  const b = Object.assign(document.createElement("button"), { className: "thumb", title: p.title || "" });
  b.dataset.i = i;
  b.append(Object.assign(document.createElement("img"), { alt: "", loading: "lazy" }));
  if (p.thumb) b.firstChild.src = p.thumb;
  else if (p.my) seen.observe(b);
  // отдельный ролик или живое фото — значок в углу миниатюры, картинка всё равно обычный
  // кадр (постер), иначе их было бы не отличить от фото (Грегори, 2026-10-14: «видео форматов,
  // iPhone .MOV. Живых фото»)
  if (p.video || p.live) b.append(Object.assign(document.createElement("span"),
    { className: "thumb-badge", textContent: p.video ? "▶" : "LIVE" }));
  b.addEventListener("click", () => navTo(i));
  $(".thumbs").append(b);
  return b;
});

function show(i) {
  if (!photos.length) return;
  index = (i + photos.length) % photos.length;
  const p = photos[index];
  document.title = `${p.title || "Фото"} — Travel Earth`;
  $(".title").textContent = p.title || "";
  const meta = $(".meta");
  meta.textContent = [p.author, p.date, p.license].filter(Boolean).join(" · ");
  // у своих фото (альбом с компьютера) ссылки на сайт нет
  if (p.page) {
    meta.append(" · ", Object.assign(document.createElement("a"), { href: p.page, target: "_blank", rel: "noopener",
      textContent: p.photo?.startsWith("mly/") ? "Mapillary" : "Wikimedia Commons" }));
  }
  $(".count").textContent = `${index + 1} / ${photos.length}`;
  if (p.my) return showMine(p);
  // снимок не свой (Commons/Mapillary) — видео и значок живого фото там не бывают, но могли
  // остаться видимыми от прошлого (своего) снимка в ленте
  stopLive();
  stageBadge.hidden = true;
  playOnceBtn.hidden = true;
  // прежний снимок остаётся на экране, пока грузится новый — старая версия подменяла его сразу
  // блёклой миниатюрой (CSS blur), и переход получался «через плохое качество» (Грегори,
  // 2026-10-16: «чёткое фото размывается и показывается в плохом качестве»); теперь перетекание
  // стартует только когда новая картинка реально готова, сразу в полном качестве
  const big = new Image();
  const apply = (src) => withTransition(() => { photoEl.hidden = false; videoEl.hidden = true; photoEl.src = src; });
  big.onload = () => { if (photos[index] === p) apply(big.src); };
  big.onerror = () => {
    if (photos[index] !== p) return;
    if (p.full && big.src !== p.full) big.src = p.full;
    else if (p.thumb) apply(p.thumb);
  };
  big.src = bigUrl(p);
  // соседние — заранее, чтобы листалось без ожидания
  for (const d of [1, -1]) new Image().src = bigUrl(photos[(index + d + photos.length) % photos.length]);
  afterShow(p);
}

let firstShow = true;
function afterShow(p) {
  $(".caption-text").hidden = !p.caption;
  $(".caption-text").textContent = p.caption || "";
  for (const stop of document.querySelectorAll(".tour .stop")) {
    const on = stop.dataset.photo === p.photo;
    stop.classList.toggle("current", on);
    if (on) stop.scrollIntoView({ block: "nearest", behavior: firstShow ? "instant" : "smooth" });
  }
  thumbs.forEach((t, k) => t.classList.toggle("active", k === index));
  // первый раз — сразу, без анимации: плавная прокрутка к 500-му снимку «показала» бы все
  // миниатюры по пути, и они встали бы в очередь
  thumbs[index].scrollIntoView({ block: "nearest", inline: "center", behavior: firstShow ? "instant" : "smooth" });
  firstShow = false;
  $(".prev").disabled = $(".next").disabled = photos.length < 2;
  // свой плей-тогл — для своих альбомов прячем всегда, а не только во время слайдшоу: у
  // альбома плеер только один, на панели в главном окне (Грегори, Round 64: «кнопка в окне
  // слайдшоу конфликтует с кнопкой на панели»; Round 66: «сделай одно окно без кнопки» — тот же
  // вопрос вернулся для окна, открытого просто кликом по фото, а не кнопкой плей)
  $(".play-toggle").hidden = p.my || photos.length < 2;
  syncPlayer();
  tellMap({ gallery: "photo", photo: p.photo });
  // слайд-шоу идёт — переставить таймер на 5 с от текущего кадра, а не от прошлого
  if (playTimer) { clearInterval(playTimer); playTimer = setInterval(() => show(index + 1), 5000); }
}

// остановить проигрывание ролика (видео или живое фото) и спрятать его — вызывается при переходе
// на снимок с чужого источника (Commons/Mapillary — там видео не бывает), чтобы не остался
// играющий ролик от прошлого своего снимка в ленте (Грегори, 2026-10-14: «просмотр видео
// форматов, iPhone .MOV. Живых фото»)
function stopLive() {
  if (videoEl.dataset.mode) {
    videoEl.pause();
    videoEl.removeAttribute("src");
    videoEl.hidden = true;
    photoEl.hidden = false;
  }
  videoEl.dataset.mode = "";
}

// текущий кадр на экране остаётся видимым, пока грузится новый (фото или ролик) — ни фото, ни
// видео никогда не остаются без src в процессе: раньше src сбрасывался сразу (removeAttribute),
// и пока файл читался, стоял пустой <img> — Edge на пустом/битом <img> показывает свою иконку
// поиска по картинке, «постоянно висящую» в углу (Грегори, 2026-10-16: «постоянно висит значок
// поиска в верхнем углу»; «чёткое фото размывается и показывается в плохом качестве»)
function loadPhoto(p) {
  host()?.myGalleryFull(p.photo).then((url) => {
    if (photos[index] !== p) return;
    withTransition(() => {
      videoEl.hidden = true;
      videoEl.removeAttribute("src");
      videoEl.dataset.mode = "";
      photoEl.hidden = false;
      photoEl.src = url;
    });
  }).catch(() => {});
}
// видео (p.video) или живое фото (p.live, fileId — отдельный ролик p.live) — нативные элементы
// управления возвращены ради ленты прокрутки (Грегори: «ушла лента прокрутки, которая должна
// остаться поверх видео»), свою кнопку play/pause внутри них прячет CSS (::-webkit-media-...),
// чтобы не дублировать .play-once снизу справа
function loadClip(p, fileId, mode) {
  host()?.myGalleryFull(fileId).then((url) => {
    if (photos[index] !== p) return;
    withTransition(() => {
      photoEl.hidden = true;
      videoEl.hidden = false;
      videoEl.dataset.mode = mode;
      videoEl.controls = true;
      videoEl.loop = false;
      // приглушённый автозапуск сразу при показе — не нужно ловить мелкую кнопку плей; звук
      // потом можно включить через нативную ленту. Без приглушения автозапуск без прямого жеста
      // (а тик слайдшоу идёт из другого окна) браузер может молча заблокировать
      videoEl.muted = true;
      videoEl.src = url;
    });
    videoEl.play().catch(() => {});
    syncPlayOnce();
  }).catch(() => {});
}
function playLive(p) { loadClip(p, p.live, "live"); }

// свой снимок: обычное фото, отдельный ролик (.MOV без пары) или живое фото — видео/живое фото
// запускаются сами, без клика (Грегори: «клик на видео или Live — проигрывать сразу»); разовое
// воспроизведение (пауза/повтор) — одной кнопкой .play-once снизу справа вместо нескольких своих
// элементов управления (Грегори, 2026-10-16: «должен быть один значок, или видео, или Live»;
// «ни одной кнопки слева снизу — я правша»)
function showMine(p) {
  playOnceBtn.hidden = !(p.video || p.live);
  // бейдж — только LIVE, для обычного видео он не нужен: состояние и так видно по иконке кнопки
  // снизу, а два подписанных элемента рядом смотрелись как две разные кнопки плей (Грегори:
  // «значки плей справа связаны, а не должны»)
  stageBadge.hidden = !p.live;
  if (p.video) loadClip(p, p.photo, "clip");
  else if (p.live) playLive(p);
  else loadPhoto(p);
  afterShow(p);
  syncPlayOnce();
}
// кнопка разового воспроизведения снизу слева — отдельно от плеера слайдшоу сверху (Грегори,
// 2026-10-16: «клик снизу управляет разовым воспроизведением, а сверху и в панели экскурсии —
// слайдшоу, синхронизированы друг с другом»); play/pause самого ролика, слайдшоу не трогает
function syncPlayOnce() {
  if (playOnceBtn.hidden) return;
  const playing = !videoEl.hidden && !videoEl.paused;
  playOnceBtn.innerHTML = playing ? PLAYER_PAUSE : PLAYER_PLAY;
  playOnceBtn.title = playing ? "Пауза" : "Воспроизвести";
}
videoEl.addEventListener("play", syncPlayOnce);
videoEl.addEventListener("pause", syncPlayOnce);
playOnceBtn.addEventListener("click", () => {
  const p = photos[index];
  if (!p?.video && !p?.live) return;
  if (p.live && videoEl.dataset.mode !== "live") { playLive(p); return; }
  if (videoEl.paused) videoEl.play().catch(() => {}); else videoEl.pause();
});
// ролик (видео или живое фото) доиграл сам — живое фото возвращается к статичному снимку (без
// зацикливания, Грегори: «зацикливание Live — не хорошая идея»), обычное видео просто стоит на
// последнем кадре, готовое начаться заново по клику .play-once (currentTime сбрасываем, иначе
// play() на уже доигранном видео тут же снова сработал бы как "ended"); и в любом случае слайдшоу
// в главном окне узнаёт об этом напрямую (не через postMessage — то же окно, тот же источник) и
// само решает, идти ли дальше (если не на паузе) или просто остаться (Грегори: «проиграл — иди
// дальше»; «при выборе конкретного эпизода — проиграть и остановиться»)
videoEl.addEventListener("ended", () => {
  videoEl.currentTime = 0;
  if (videoEl.dataset.mode === "live") loadPhoto(photos[index]);
  syncPlayOnce();
  if (albumId) host()?.albumClipEnded?.();
});

// плеер своего альбома сверху — те же назад/плей/дальше/стоп, что и в панели альбома в главном
// окне (PREV_ICON/PLAY_ICON/PAUSE_ICON/NEXT_ICON/STOP_ICON там же); тут просто те же рисунки
// (Грегори: «кнопки... должны повторять кнопки в панели альбома»)
const PLAYER_PREV = `<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>`;
const PLAYER_PLAY = `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>`;
const PLAYER_PAUSE = `<svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
const PLAYER_NEXT = `<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>`;
const PLAYER_STOP = `<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>`;
// остальной код (afterShow и т.п.) зовёт syncPlayer() безусловно — для не своих альбомов (нет
// albumId) это просто пустая функция
let syncPlayer = () => {};
if (albumId) {
  const bar = $(".player");
  bar.hidden = false;
  const playBtn = $(".player-play"), prevBtn = $(".player-prev"), nextBtn = $(".player-next"), stopBtn = $(".player-stop");
  syncPlayer = () => {
    const st = host()?.albumPlayState?.();
    const active = !!st && st.albumId === albumId;
    const playing = active && !st.paused;
    playBtn.innerHTML = playing ? PLAYER_PAUSE : PLAYER_PLAY;
    playBtn.classList.toggle("on", playing);
    playBtn.title = !active ? "Слайдшоу альбома" : st.paused ? "Продолжить" : "Пауза";
    prevBtn.disabled = nextBtn.disabled = stopBtn.disabled = !active;
  };
  playBtn.innerHTML = PLAYER_PLAY;
  prevBtn.innerHTML = PLAYER_PREV;
  nextBtn.innerHTML = PLAYER_NEXT;
  stopBtn.innerHTML = PLAYER_STOP;
  playBtn.addEventListener("click", () => {
    const st = host()?.albumPlayState?.();
    // передаём именно тот снимок, что сейчас открыт в этом окне — чтобы плей продолжил с него,
    // а не прыгнул на первый кадр альбома (Грегори: «клик сверху должен запускать видео/Live,
    // если хочу продолжить просмотр»)
    if (st && st.albumId === albumId) host()?.albumPlayPause?.(); else host()?.startAlbumPlay?.(albumId, photos[index].photo);
    syncPlayer();
  });
  prevBtn.addEventListener("click", () => { host()?.albumPlayGo?.(-1); syncPlayer(); });
  nextBtn.addEventListener("click", () => { host()?.albumPlayGo?.(1); syncPlayer(); });
  stopBtn.addEventListener("click", () => { host()?.stopAlbumPlay?.(); syncPlayer(); });
  syncPlayer();
}

// карта в главном окне следит за текущим снимком (выделяет и подвигается к нему)
function tellMap(msg) {
  try { window.opener?.postMessage(msg, location.origin); } catch { /* главное окно закрыто */ }
}
addEventListener("pagehide", () => { clearInterval(playTimer); tellMap({ gallery: "closed" }); });
// галерея слайд-шоу аудиогида: новая остановка — новый список (перезагрузка), смена слайда —
// тот же снимок здесь (galleryShow)
addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.galleryReload) location.reload();
  // без проверки "индекс и правда другой" — иначе запуск/возврат на ролик, который уже показан
  // в этом окне (тот же кадр), молча ничего не делал, а видео/Live не запускались заново
  // (Грегори: «клик на верхней панели не запускает видео/LIVE, если хочу продолжить просмотр»)
  else if (Number.isInteger(e.data?.galleryShow)) show(e.data.galleryShow);
  else if (typeof e.data?.galleryPause === "boolean") {
    // плей/пауза нажали в панели альбома главного окна — ролик на экране ставим на паузу/
    // продолжаем вместе со слайдшоу (Грегори: «при нажатии на плей крутить слайдшоу с этого
    // места дальше»); обычное фото просто ждёт своей очереди — там нечего ставить на паузу
    if (!videoEl.hidden) { if (e.data.galleryPause) videoEl.pause(); else videoEl.play().catch(() => {}); }
    syncPlayer();
  }
});
if (data.stop) document.title = `${data.stop} — Travel Earth`;

// переход внутри самого окна галереи (стрелки/миниатюры/клавиши) — в отличие от навигации по
// сообщению извне (galleryShow выше), держит плеер альбома в главном окне в курсе места, но не
// отправляет сообщение обратно в это же окно (кадр тут и так уже показан) — всегда ставит на
// паузу, без зацикливания (Грегори: «при клике на конкретный кадр останови слайдшоу»)
function navTo(i) {
  show(i);
  if (albumId) host()?.albumJumpTo?.(index);
}
$(".prev").addEventListener("click", () => navTo(index - 1));
$(".next").addEventListener("click", () => navTo(index + 1));
// клик по самому кадру (не по кнопкам навигации/разового воспроизведения) — переключатель
// паузы слайдшоу: ещё раз клик или «Продолжить» в плеере — едем дальше с этого места (Грегори:
// «слайдшоу должно останавливаться... ждать клика на фото, или продолжения»; «сверху и в панели
// экскурсии запускают/останавливают слайдшоу, синхронизированы друг с другом»)
$(".stage").addEventListener("click", (e) => {
  if (!albumId || e.target.closest(".nav, .play-once")) return;
  host()?.albumPlayPause?.();
  syncPlayer();
});
$(".play-toggle").addEventListener("click", () => {
  const on = !playTimer;
  clearInterval(playTimer);
  playTimer = on ? setInterval(() => show(index + 1), 5000) : null;
  $(".play-toggle").classList.toggle("on", on);
  $(".play-toggle").textContent = on ? "❚❚" : "▶";
  $(".play-toggle").title = on ? "Пауза" : "Слайд-шоу: смена каждые 5 с";
});
// после F11 выход из полноэкранного режима шлёт сюда тот же Esc, что и закрытие окна — без
// этой защиты выход из полного экрана заодно закрывал галерею (Грегори, 2026-10-16: «после F11
// выход Esc не должен закрывать окно»). У F11 (в отличие от Fullscreen API) нет события,
// которое это подтвердило бы напрямую — отличаем по resize тут же перед Esc
let lastResize = 0;
// тот же resize, что отличает F11 от закрытия окна чуть ниже, заодно отслеживает сам F11: окно
// без системной рамки занимает весь физический экран (обычный Maximize — нет, там остаётся место
// под панель задач) — в этом режиме прячем ленту миниатюр, чтобы фото/видео занимало весь экран
// (Грегори, 2026-10-16: «в режиме F11 убери ленту фотографий»)
function syncFullscreen() {
  const full = window.innerWidth >= screen.width - 2 && window.innerHeight >= screen.height - 2;
  $(".thumbs").hidden = full;
}
window.addEventListener("resize", () => { lastResize = Date.now(); syncFullscreen(); });
syncFullscreen();
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") navTo(index - 1);
  else if (e.key === "ArrowRight") navTo(index + 1);
  else if (e.key === "Home") navTo(0);
  else if (e.key === "End") navTo(photos.length - 1);
  else if (e.key === "Escape" && Date.now() - lastResize > 500) window.close();
});
$(".thumbs").addEventListener("wheel", (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) $(".thumbs").scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });

// экскурсия альбома: заголовки, абзацы и «остановки» — снимок с подписью, щелчок открывает его
const tour = data.excursion;
if (tour) {
  const panel = $(".tour");
  const byName = new Map(photos.map((p, i) => [p.title.toLowerCase(), i]));
  panel.append(Object.assign(document.createElement("h2"), { textContent: tour.title }));
  for (const b of tour.blocks) {
    if (b.type === "h") panel.append(Object.assign(document.createElement("h3"), { textContent: b.text }));
    else if (b.type === "p") panel.append(Object.assign(document.createElement("p"), { textContent: b.text }));
    else {
      const i = byName.get(b.file.toLowerCase());
      if (i === undefined) continue;
      const stop = Object.assign(document.createElement("button"), { className: "stop" });
      stop.dataset.photo = photos[i].photo;
      const img = Object.assign(document.createElement("img"), { alt: "" });
      if (photos[i].thumb) img.src = photos[i].thumb;
      else host()?.myGalleryThumb(photos[i].photo).then((url) => { img.src = url; }).catch(() => {});
      stop.append(img, Object.assign(document.createElement("span"), { textContent: b.text || b.file }));
      stop.addEventListener("click", () => navTo(i));
      panel.append(stop);
    }
  }
  const toggle = $(".tour-toggle");
  toggle.hidden = false;
  const setTour = (on) => { panel.hidden = !on; toggle.classList.toggle("on", on); localStorage.setItem("travel-earth.tour", on ? "1" : "0"); };
  toggle.addEventListener("click", () => setTour(panel.hidden));
  setTour(localStorage.getItem("travel-earth.tour") !== "0");
}

if (photos.length) show(index);
else { $(".stage").replaceChildren(Object.assign(document.createElement("div"), { className: "empty", textContent: "Нет снимков" })); $(".play-toggle").hidden = true; }
</script>
</body>
</html>
