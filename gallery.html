<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фото — Travel Earth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<meta name="theme-color" content="#111">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: 1fr auto;
    background: #111;
    color: #eee;
    font-family: "Poppins", system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* подпись и кнопки плеера — плавающая панель ПОВЕРХ фото, а не отдельная строка над ним: раньше
     съедала «большой отступ на три строки» сверху (Грегори, 2026-10-16: «фото до самого верха»).
     Лежит внутри .stage (ниже), а не body — иначе перекрывала бы и панель экскурсии справа.
     Без подложки-градиента — он выглядел отдельной тёмной полосой над фото (Грегори, 2026-10-16:
     «по заголовку идёт тень с верху и с низу»); читаемость текста держит text-shadow ниже, а у
     кнопок своя полупрозрачная подложка */
  .bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    pointer-events: none;
    /* подпись/счётчик — не текст для чтения мышью, а подписи поверх фото; случайное
       перетаскивание мышью (клик мимо кнопки) выделяло их ярким синим и не давало снять
       выделение кликом по фото (Грегори, 2026-10-16: «не позволяй выделять надписи... потом
       не снять») */
    user-select: none;
    -webkit-user-select: none;
  }
  .bar > * { pointer-events: auto; }
  .caption { flex: 1; min-width: 0; text-align: right; }
  .title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
  .meta { font-size: 0.78rem; color: #aaa; margin-top: 2px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }
  .meta a { color: #8ab4f8; }
  .count { font-size: 0.85rem; color: #ddd; white-space: nowrap; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }

  .stage { position: relative; min-height: 0; }
  .stage img, .stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  /* бейдж LIVE — пассивная подпись, лежит в колонке .player-wrap (ниже) вместе со счётчиком,
     а не отдельным оверлеем поверх .stage: был position:absolute со своим top, завязанным на
     высоту области заголовка — при изменении размера окна двигался отдельно от счётчика и кнопок
     и наезжал на них (Грегори, 2026-10-16: «индикатор Live постоянно двигается при масштабировании
     окна и привязан к панели кнопок браузера, тогда как количество кадров и кнопки привязаны к
     краю окна»). Порядок внутри колонки — i-кнопка, LIVE, счётчик, кнопки плеера снизу (Грегори,
     2026-10-18: «поменяй местами количество фото и Live»; до этого — 2026-10-17: «кнопки опускаем»).
     Для обычного видео бейдж вообще не нужен — его состояние и так видно по иконке кнопки снизу.
     [hidden] объявлен отдельным правилом — иначе его проигрывает по специфичности display:flex
     класса ниже, и бейдж никогда не скрывается (Грегори, 2026-10-16: «значок Live не уходит») */
  .stage-badge {
    border-radius: 12px;
    padding: 4px 10px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font: 600 0.72rem "Poppins", sans-serif;
    letter-spacing: 0.04em;
    pointer-events: none;
  }
  .stage-badge[hidden] { display: none; }

  /* кнопка-подсказка над колонкой .player-wrap — что F11 и стрелки умеют делать (Грегори,
     2026-10-18: «кнопку i... пишем туда про F11 и управление альбомом стрелками»); тот же
     полупрозрачный круг, что у .nav/.player-btn, но мельче — это не основное управление, а
     запасная справка */
  .info-btn {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font: italic 700 0.8rem Georgia, serif;
    cursor: pointer;
  }
  .info-btn:hover { background: rgba(0, 0, 0, 0.7); }
  .info-banner {
    max-width: 220px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.8);
    color: #ddd;
    font-size: 0.8rem;
    line-height: 1.4;
  }
  .info-banner[hidden] { display: none; }
  .info-banner p { margin: 0; }
  /* временный диагностический счётчик (2026-10-18, см. HTML) — простой текстовый лог поверх
     кадра, без претензии на красоту, уберём после отладки */
  .live-debug {
    position: absolute;
    left: 8px;
    bottom: 8px;
    max-width: calc(100% - 16px);
    max-height: 40%;
    overflow-y: auto;
    padding: 6px 8px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.75);
    color: #7f7;
    font: 11px/1.4 monospace;
    white-space: pre;
    z-index: 5;
  }
  .live-debug[hidden] { display: none; }
  .info-banner p + p { margin-top: 4px; }

  /* нативная лента прокрутки видео — свой урезанный вариант (.scrub, без времени и звука)
     Грегори не устроил, вернули как было; родную кнопку play/pause тоже вернули (Грегори,
     2026-10-17: «открыть стандартную кнопку плай на видео»); прячем только кнопку полного
     экрана внутри видео и троеточие меню — звук и сама лента прокрутки остаются */
  video.photo::-webkit-media-controls-fullscreen-button,
  video.photo::-webkit-media-controls-overflow-button { display: none !important; }
  /* полоса прокрутки видео — обычной толщины: просьбу «увеличить в 2 раза» (2026-10-17) приняли
     было на счёт неё, но Грегори уточнил (2026-10-18, со скриншотом, где видео-полоса отмечена
     крестом): «не прокрутку видео, а прокрутку ленты» — это была лента миниатюр (.thumb выше) */
  /* в альбомной ориентации окна .stage широкий и невысокий — элемент video.photo растягивается
     на всю его ширину (object-fit: contain просто оставляет чёрные поля по бокам у видео), а
     нативная панель controls по умолчанию растягивается на всю ширину САМОГО ЭЛЕМЕНТА video, то
     есть лента прокрутки тянется и через эти чёрные поля — выглядит нелепо широкой (Грегори,
     2026-10-16: «проблема изменения пропорций окна»; «в альбомной размер можно оставлять меньше
     ширины принудительно»). Сам размер иконок внутри панели браузер считает по ширине элемента
     video, а не по ширине самой панели — это нельзя переопределить через CSS, поэтому одинаковых
     иконок в обеих ориентациях не добиться, не меняя размер самого видео (а трогать размер видео
     Грегори прямо попросил не надо, только панель). Но ширину панели сузить и отцентровать можно:
     --controls-w выставляет syncVideoControlsWidth() по ширине реально видимой (не запечатанной
     чёрными полями) картинки */
  .stage.landscape video.photo::-webkit-media-controls-panel {
    max-width: var(--controls-w, 100%);
    margin: 0 auto;
  }

  .nav {
    position: absolute;
    top: 50%;
    width: 48px;
    height: 48px;
    margin-top: -24px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font-size: 28px;
    line-height: 48px;
    cursor: pointer;
  }
  .nav:hover { background: rgba(0, 0, 0, 0.7); }
  .nav:disabled { visibility: hidden; }
  .prev { left: 12px; }
  .next { right: 12px; }

  /* лента миниатюр — как на карте: тонкая рамка у выбранного, ничего не прыгает */
  .thumbs {
    display: flex;
    gap: 2px;
    padding: 6px 16px 10px;
    overflow-x: auto;
    scrollbar-color: #444 transparent;
  }
  /* ползунок прокрутки самой ленты — вдвое толще обычного тонкого, тот же приём, что раньше
     применили (а потом вернули) у полосы прокрутки видео (Грегори, 2026-10-18: «увеличь толщину
     ползунка прокрутки ленты»; «не прокрутку видео, а прокрутку ленты» — это разные полосы) */
  .thumbs::-webkit-scrollbar { height: 14px; }
  .thumbs::-webkit-scrollbar-track { background: transparent; }
  .thumbs::-webkit-scrollbar-thumb { background: #444; border-radius: 7px; }
  /* [hidden] объявлен отдельно — тот же приём, что у .stage-badge выше: без этого
     display:flex класса всегда побеждал бы спрятанный атрибут (режим F11, см. syncFullscreen) */
  .thumbs[hidden] { display: none; }
  .thumb {
    position: relative;
    flex: none;
    width: 72px;
    height: 72px;
    padding: 0;
    border: none;
    border-radius: 6px;
    background: #222;
    overflow: hidden;
    cursor: pointer;
    opacity: 0.6;
  }
  .thumb:hover, .thumb.active { opacity: 1; }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 3px solid transparent;
    border-radius: 6px;
  }
  .thumb.active::after { border-color: #e91e63; }
  /* значок в ленте миниатюр — отдельный ролик (▶) или живое фото (LIVE), чтобы было видно
     без открытия самого снимка (Грегори, 2026-10-14: «просмотр видео форматов... живых фото») */
  .thumb-badge {
    position: absolute;
    bottom: 3px;
    right: 3px;
    color: #fff;
    font-size: 0.6rem;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    pointer-events: none;
  }
  .empty { display: grid; place-items: center; color: #aaa; }

  /* экскурсия (текст из папки альбома): панель справа; подпись снимка — под названием */
  .main { display: flex; min-height: 0; }
  .main .stage { flex: 1; }
  .tour {
    width: 360px;
    padding: 12px 18px 24px;
    overflow-y: auto;
    border-left: 1px solid #2a2a2a;
    font-size: 0.88rem;
    line-height: 1.5;
    scrollbar-width: thin;
    scrollbar-color: #444 transparent;
  }
  .tour h2 { margin: 0 0 10px; font-size: 1.05rem; font-weight: 600; }
  .tour h3 { margin: 18px 0 6px; font-size: 0.92rem; font-weight: 600; color: #fff; }
  .tour p { margin: 0 0 10px; color: #ccc; }
  .tour .stop {
    display: flex;
    gap: 10px;
    width: 100%;
    margin: 0 0 10px;
    padding: 6px;
    border: none;
    border-radius: 8px;
    background: #1c1c1c;
    color: #ddd;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .tour .stop:hover { background: #262626; }
  .tour .stop.current { outline: 2px solid #e91e63; }
  .tour .stop img { flex: none; width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: #222; }
  .tour-toggle {
    border: none;
    border-radius: 14px;
    padding: 6px 14px;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    font: inherit;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .tour-toggle:hover { background: rgba(0, 0, 0, 0.7); }
  .tour-toggle.on { background: #e91e63; }
  /* плеер слайд-шоу: та же пилюля, что у переключателя «Экскурсия» (Грегори, 2026-10-11
     продолжение: «после клика на альбом должно появляться новое окно с одним альбомом и
     плейером для слайдшоу») — автосмена снимков каждые 5 с, пока нажата */
  .play-toggle { min-width: 34px; text-align: center; }
  .play-toggle.on { background: #e91e63; }
  .caption-text { font-size: 0.85rem; color: #ddd; font-style: italic; margin-top: 4px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); }

  /* плеер своего альбома — назад/дальше/стоп/плей, тот же кружок-значок, что у .nav (Грегори,
     2026-10-16: «все кнопки должны быть как микрофон» — компактный полупрозрачный круг). Плей —
     последним, справа (Грегори: «треугольник для удобства самый правый»). Своя плавающая колонка
     внизу справа (на месте бывшей .play-once — Грегори, 2026-10-17: «кнопку убираем», «кнопки
     воспроизведения альбома» туда же), а не часть .bar вверху — счётчик и значок LIVE сверху,
     кнопки снизу (Грегори: «кнопки опускаем и переворачиваем порядок»); тот же отступ снизу, что
     был у .play-once — чтобы не наезжать на нативную ленту прокрутки видео (controls=true ниже) */
  .player-wrap {
    position: absolute;
    bottom: 64px;
    right: 16px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  .player { display: flex; align-items: center; gap: 6px; }
  .player-btn {
    display: inline-grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    cursor: pointer;
  }
  .player-btn:hover { background: rgba(0, 0, 0, 0.7); }
  .player-btn:disabled { opacity: 0.35; cursor: default; background: rgba(0, 0, 0, 0.45); }
  .player-btn.on { background: #e91e63; color: #fff; }

  /* переход между кадрами слайдшоу — перетекание (View Transitions API сам крест-фейдит документ
     целиком, без второго элемента-дубля); длительность длиннее дефолтных 0.25 с (Грегори,
     2026-10-16: «сделай переходы между фото с перетеканием») */
  /* по умолчанию переход снимает ВЕСЬ документ (root) целиком — на время анимации браузер
     прячет настоящий DOM и показывает только снимки «до/после», поэтому клики по ленте
     миниатюр и кнопкам плеера (вне самого фото) все 0.6с анимации проваливались в пустоту
     (Грегори, 2026-10-17: «кликаю на первую миниатюру... реакции ноль»); pointer-events:none
     на оверлее не помогает — дело не в перехвате клика оверлеем, а в том, что сам документ
     прячется. Сужаем переход только до .stage (сам снимок/видео) — остальное (лента, плеер)
     в захват не попадает и остаётся живым и кликабельным всё время анимации */
  :root { view-transition-name: none; }
  .stage { view-transition-name: photo-stage; }
  ::view-transition-old(photo-stage), ::view-transition-new(photo-stage) { animation-duration: 0.6s; }
  ::view-transition { pointer-events: none; }

  /* как в index.html: открытое из установленного приложения окно тоже без системного заголовка
     (window-controls-overlay наследуется дочерними окнами того же PWA) — без этой полоски его
     было нечем перетащить на другой монитор (Грегори, 2026-10-11: «окно альбома не сдвинуть») */
  .titlebar-drag { display: none; }
  @media (display-mode: window-controls-overlay) {
    .titlebar-drag {
      display: block;
      position: fixed;
      left: env(titlebar-area-x, 0);
      top: env(titlebar-area-y, 0);
      width: env(titlebar-area-width, 100%);
      height: env(titlebar-area-height, 33px);
      app-region: drag;
      -webkit-app-region: drag;
      z-index: 20;
    }
    /* .bar теперь лежит поверх фото (см. выше), а не в потоке body — в установленном приложении
       сдвигаем саму панель вниз, а не body, иначе её кнопки попали бы под область перетаскивания
       и не нажимались бы */
    .bar { top: env(titlebar-area-height, 33px); }
  }
</style>
</head>
<body>
<div class="titlebar-drag"></div>
<div class="main">
  <div class="stage">
    <img class="photo" alt="">
    <video class="photo" playsinline hidden></video>
    <!-- временный диагностический счётчик живого фото (2026-10-18) — уберём, когда разберёмся
         с «передёргиванием»; показывает реальные тайминги у Грегори, а не в моих тестах -->
    <div class="live-debug" hidden></div>
    <div class="bar">
      <button class="tour-toggle" hidden>Экскурсия</button>
      <button class="tour-toggle play-toggle" title="Слайд-шоу: смена каждые 5 с">▶</button>
      <div class="caption"><div class="title"></div><div class="meta"></div><div class="caption-text" hidden></div></div>
    </div>
    <div class="player-wrap">
      <button class="info-btn" title="Подсказка">i</button>
      <div class="info-banner" hidden>
        <p>F11 — полноэкранный режим.</p>
        <p>Стрелки ← → — пролистать фото, ↑ — плей/пауза альбома.</p>
      </div>
      <span class="stage-badge" hidden>LIVE</span>
      <div class="count"></div>
      <div class="player" hidden>
        <button class="player-btn player-prev" title="Назад"></button>
        <button class="player-btn player-next" title="Дальше"></button>
        <button class="player-btn player-stop" title="Стоп"></button>
        <button class="player-btn player-play" title="Слайдшоу альбома"></button>
      </div>
    </div>
    <button class="nav prev" title="Назад (←)">‹</button>
    <button class="nav next" title="Вперёд (→)">›</button>
  </div>
  <div class="tour" hidden></div>
</div>
<div class="thumbs"></div>
<script>
// Галерея снимков ленты: список кладёт app.js в localStorage ("travel-earth.gallery") перед
// открытием окна; текущий снимок выделяется на карте в главном окне. ← → — листать, Home/End — к первому/последнему, Esc — закрыть окно
const data = JSON.parse(localStorage.getItem("travel-earth.gallery") || "null") || { photos: [], start: 0 };
const photos = data.photos;
// альбом — чтобы свои кнопки плеера сверху могли звать плей/пауза/назад/дальше/стоп напрямую
// в главном окне (window.opener), как в панели альбома (Грегори, 2026-10-16: «кнопки должны
// повторять кнопки в панели альбома»)
const albumId = data.albumId || null;
let index = Math.min(Math.max(0, data.start || 0), photos.length - 1);
const $ = (sel) => document.querySelector(sel);
// снимок и ролик — отдельные теги с одним классом .photo (позиционирование общее в CSS),
// поэтому сами ссылки берём по тегу, а не по классу
const photoEl = document.querySelector("img.photo");
const videoEl = document.querySelector("video.photo");
const stageBadge = $(".stage-badge");
// плеер слайд-шоу — автосмена каждые 5 с, пока нажата кнопка; любая навигация (ручная или
// автоматическая) переставляет таймер, чтобы темп не сбивался
let playTimer = null;
// пользователь один раз включил звук нативной лентой — запоминаем на весь альбом, иначе каждый
// новый ролик (loadClip ниже) снова принудительно мьютил бы его (Грегори, 2026-10-17: «звук
// сбрасывается тут же после нажатия» при переходе на следующее видео)
let wantsSound = false;
videoEl.addEventListener("volumechange", () => { wantsSound = !videoEl.muted; });
// наши собственные videoEl.play()/pause() (автозапуск нового ролика, пауза/плей, пришедшие
// из панели альбома в главном окне) не должны считаться «пользователь
// нажал на нативную кнопку плей/пауза видео» — выставляется в true прямо перед каждым таким
// вызовом, а гасится самим обработчиком play/pause ниже при первом срабатывании после него
let suppressAlbumPauseSync = false;
// перетекание между кадрами — View Transitions API сам крест-фейдит документ до/после fn();
// без него (старые браузеры) — просто мгновенная смена, без анимации
function withTransition(fn) {
  if (document.startViewTransition) return document.startViewTransition(fn);
  fn();
  return null;
}
// появление видео (ролик/живое фото) после фото — НЕ через View Transitions API: тот снимает
// статичный СКРИНШОТ видео в момент старта перехода, а реальное видео продолжает играть все
// 0.6с крест-фейда и к его концу убегает далеко вперёд от этого замороженного кадра — в момент
// завершения перехода картинка «скачет» на актуальный кадр видео. Выглядит как «видео пошло
// вперёд, потом будто перезапустилось с переходом» (Грегори, 2026-10-18: «проблема с двойным
// началом»). Вместо снимка крест-фейдим сами живые элементы через CSS opacity — видео все 0.6с
// рисует реальные текущие кадры напрямую, скачка в конце нет
function revealVideoCrossfade() {
  videoEl.hidden = false;
  videoEl.style.opacity = "0";
  requestAnimationFrame(() => {
    videoEl.style.transition = photoEl.style.transition = "opacity 0.6s";
    videoEl.style.opacity = "1";
    photoEl.style.opacity = "0";
  });
  setTimeout(() => {
    photoEl.hidden = true;
    resetFade();
    // нативная лента controls включается только ПОСЛЕ кроссфейда, а не сразу при показе видео
    // (Грегори, 2026-10-18: «проблема с двойным началом» — не изменилось после замены View
    // Transition на обычный opacity-кроссфейд, то есть дело не в самом переходе, а в чём-то общем
    // для обеих версий — в появлении видео как такового. Controls у Chrome при первом появлении
    // проигрывают свою анимацию «сейчас играет» независимо от того, когда controls=true был
    // выставлен в разметке — если это совпадает по времени с нашим кроссфейдом, выглядит как
    // повторный «переход». Отодвигаем включение controls на момент ПОСЛЕ кроссфейда, чтобы эта
    // анимация (если она и есть) не накладывалась на наш переход фото → видео)
    videoEl.controls = true;
  }, 600);
}
// сброс инлайн-стилей кроссфейда выше — на случай, если переход прервали (сменили кадр раньше,
// чем успел доиграть таймаут) до следующего show()/stopLive(), иначе следующее фото могло бы
// остаться с opacity:0 от прошлого кроссфейда
function resetFade() {
  photoEl.style.opacity = videoEl.style.opacity = photoEl.style.transition = videoEl.style.transition = "";
}

// крупный снимок: у Commons миниатюры стандартных размеров; оригинал — если он не больше 1920
const bigUrl = (p) => (p.fullWidth > 1920 && p.thumb ? p.thumb.replace(/\/\d+px-/, "/1920px-") : p.full || p.thumb);

// свои фото (альбом с компьютера): файлы читает главное окно — миниатюру делает, когда её
// клетка ленты видна (по одной, чтобы не вешать браузер), оригинал отдаёт только открытому
const host = () => {
  try { return [window.opener, window.parent].find((w) => w && w !== window && w.myGalleryThumb) || null; } catch { return null; }
};
const thumbQueue = [];
let thumbBusy = false;
// клетка ещё рядом с видимой частью ленты? (пока ждала очереди, ленту могли прокрутить)
function nearView(el) {
  const r = el.getBoundingClientRect(), root = document.querySelector(".thumbs").getBoundingClientRect();
  return r.right > root.left - 400 && r.left < root.right + 400;
}
function pumpThumbs() {
  if (thumbBusy || !host()) return;
  while (thumbQueue.length && !nearView(thumbQueue[0][1].parentElement)) seen.observe(thumbQueue.shift()[1].parentElement);
  if (!thumbQueue.length) return;
  thumbBusy = true;
  const [p, img] = thumbQueue.shift();
  host().myGalleryThumb(p.photo).then((url) => { p.thumb = url; img.src = url; }).catch(() => {})
    .finally(() => { thumbBusy = false; pumpThumbs(); });
}
const seen = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    seen.unobserve(e.target);
    const i = Number(e.target.dataset.i);
    thumbQueue.push([photos[i], e.target.firstChild]);
  }
  pumpThumbs();
}, { root: document.querySelector(".thumbs"), rootMargin: "0px 400px" });

const thumbs = photos.map((p, i) => {
  const b = Object.assign(document.createElement("button"), { className: "thumb", title: p.title || "" });
  b.dataset.i = i;
  b.append(Object.assign(document.createElement("img"), { alt: "", loading: "lazy" }));
  if (p.thumb) b.firstChild.src = p.thumb;
  else if (p.my) seen.observe(b);
  // отдельный ролик или живое фото — значок в углу миниатюры, картинка всё равно обычный
  // кадр (постер), иначе их было бы не отличить от фото (Грегори, 2026-10-14: «видео форматов,
  // iPhone .MOV. Живых фото»)
  if (p.video || p.live) b.append(Object.assign(document.createElement("span"),
    { className: "thumb-badge", textContent: p.video ? "▶" : "LIVE" }));
  b.addEventListener("click", () => navTo(i));
  $(".thumbs").append(b);
  return b;
});

function show(i) {
  if (!photos.length) return;
  index = (i + photos.length) % photos.length;
  const p = photos[index];
  document.title = `${p.title || "Фото"} — Travel Earth`;
  $(".title").textContent = p.title || "";
  const meta = $(".meta");
  meta.textContent = [p.author, p.date, p.license].filter(Boolean).join(" · ");
  // у своих фото (альбом с компьютера) ссылки на сайт нет
  if (p.page) {
    meta.append(" · ", Object.assign(document.createElement("a"), { href: p.page, target: "_blank", rel: "noopener",
      textContent: p.photo?.startsWith("mly/") ? "Mapillary" : "Wikimedia Commons" }));
  }
  $(".count").textContent = `${index + 1} / ${photos.length}`;
  if (p.my) return showMine(p);
  // снимок не свой (Commons/Mapillary) — видео и значок живого фото там не бывают, но могли
  // остаться видимыми от прошлого (своего) снимка в ленте
  stopLive();
  stageBadge.hidden = true;
  // прежний снимок остаётся на экране, пока грузится новый — старая версия подменяла его сразу
  // блёклой миниатюрой (CSS blur), и переход получался «через плохое качество» (Грегори,
  // 2026-10-16: «чёткое фото размывается и показывается в плохом качестве»); теперь перетекание
  // стартует только когда новая картинка реально готова, сразу в полном качестве
  const big = new Image();
  const apply = (src) => withTransition(() => { photoEl.hidden = false; videoEl.hidden = true; photoEl.src = src; resetFade(); });
  big.onload = () => { if (photos[index] === p) apply(big.src); };
  big.onerror = () => {
    if (photos[index] !== p) return;
    if (p.full && big.src !== p.full) big.src = p.full;
    else if (p.thumb) apply(p.thumb);
  };
  big.src = bigUrl(p);
  // соседние — заранее, чтобы листалось без ожидания
  for (const d of [1, -1]) new Image().src = bigUrl(photos[(index + d + photos.length) % photos.length]);
  afterShow(p);
}

let firstShow = true;
function afterShow(p) {
  $(".caption-text").hidden = !p.caption;
  $(".caption-text").textContent = p.caption || "";
  for (const stop of document.querySelectorAll(".tour .stop")) {
    const on = stop.dataset.photo === p.photo;
    stop.classList.toggle("current", on);
    if (on) stop.scrollIntoView({ block: "nearest", behavior: firstShow ? "instant" : "smooth" });
  }
  thumbs.forEach((t, k) => t.classList.toggle("active", k === index));
  // первый раз — сразу, без анимации: плавная прокрутка к 500-му снимку «показала» бы все
  // миниатюры по пути, и они встали бы в очередь
  thumbs[index].scrollIntoView({ block: "nearest", inline: "center", behavior: firstShow ? "instant" : "smooth" });
  firstShow = false;
  $(".prev").disabled = $(".next").disabled = photos.length < 2;
  // свой плей-тогл — для своих альбомов прячем всегда, а не только во время слайдшоу: у
  // альбома плеер только один, на панели в главном окне (Грегори, Round 64: «кнопка в окне
  // слайдшоу конфликтует с кнопкой на панели»; Round 66: «сделай одно окно без кнопки» — тот же
  // вопрос вернулся для окна, открытого просто кликом по фото, а не кнопкой плей)
  $(".play-toggle").hidden = p.my || photos.length < 2;
  syncPlayer();
  tellMap({ gallery: "photo", photo: p.photo });
  // слайд-шоу идёт — переставить таймер на 5 с от текущего кадра, а не от прошлого
  if (playTimer) { clearInterval(playTimer); playTimer = setInterval(() => show(index + 1), 5000); }
}

// остановить проигрывание ролика (видео или живое фото) и спрятать его — вызывается при переходе
// на снимок с чужого источника (Commons/Mapillary — там видео не бывает), чтобы не остался
// играющий ролик от прошлого своего снимка в ленте (Грегори, 2026-10-14: «просмотр видео
// форматов, iPhone .MOV. Живых фото»)
function stopLive() {
  if (videoEl.dataset.mode) {
    suppressAlbumPauseSync = true;
    videoEl.pause();
    videoEl.removeAttribute("src");
    videoEl.hidden = true;
    photoEl.hidden = false;
    resetFade();
  }
  videoEl.dataset.mode = "";
  liveDebugEl.hidden = true;
}

// временный диагностический лог живого фото (2026-10-18) — показывает реальные тайминги у
// Грегори на экране, а не только в моих тестах; уберём, когда разберёмся с «передёргиванием»
const liveDebugEl = $(".live-debug");
let liveDebugT0 = 0;
function liveDebugReset() { liveDebugT0 = performance.now(); liveDebugEl.textContent = ""; liveDebugEl.hidden = false; }
function liveDebug(msg) {
  liveDebugEl.hidden = false;
  liveDebugEl.textContent += `${Math.round(performance.now() - liveDebugT0)}мс: ${msg}\n`;
  liveDebugEl.scrollTop = liveDebugEl.scrollHeight;
}

// текущий кадр на экране остаётся видимым, пока грузится новый (фото или ролик) — ни фото, ни
// видео никогда не остаются без src в процессе: раньше src сбрасывался сразу (removeAttribute),
// и пока файл читался, стоял пустой <img> — Edge на пустом/битом <img> показывает свою иконку
// поиска по картинке, «постоянно висящую» в углу (Грегори, 2026-10-16: «постоянно висит значок
// поиска в верхнем углу»; «чёткое фото размывается и показывается в плохом качестве»)
function loadPhoto(p, instant, onShown) {
  host()?.myGalleryFull(p.photo).then((url) => {
    if (photos[index] !== p) return;
    const apply = () => {
      videoEl.hidden = true;
      videoEl.removeAttribute("src");
      videoEl.dataset.mode = "";
      photoEl.hidden = false;
      photoEl.src = url;
      resetFade();
    };
    // живое фото доигрывает само и возвращается сюда (videoEl "ended" ниже) часто и быстро
    // подряд — крест-фейд в ещё не готовую картинку (без предзагрузки) накладывал переходы друг
    // на друга и давал «гонки» и постоянную иконку загрузки (Грегори, 2026-10-16: «живые фото
    // начинаются гонки... причина тоже в переходе»); для этого случая переход пропускаем
    if (instant) { apply(); onShown?.(null); return; }
    // обычная смена фото — переход оставляем (Грегори, 2026-10-17: «я не просил убрать
    // анимацию»), но предзагружаем картинку заранее, как show() делает для чужих (Commons)
    // фото — иначе та же беда с крест-фейдом в неготовую картинку
    const img = new Image();
    img.onload = img.onerror = () => {
      if (photos[index] !== p) return;
      // onShown получает сам переход (ViewTransition) — живому фото (playLive) нужно дождаться,
      // пока ОН реально доиграет до конца, прежде чем запускать свой собственный переход на
      // видео: иначе второй startViewTransition обрывает первый на середине анимации, и это
      // выглядит как рывок (Грегори, 2026-10-18: «пауза, а затем передёргивание туда-сюда»).
      // withTransition(apply) — ОТДЕЛЬНОЙ строкой, не аргументом onShown?.(...): если onShown не
      // передан (обычное фото без live/video), «?.» схлопывает ВЕСЬ вызов вместе с аргументом —
      // withTransition(apply) тогда вообще не вычисляется, и фото остаётся чёрным экраном
      // (Грегори, 2026-10-18: «при клике на фото картинка не меняется»)
      const vt = withTransition(apply);
      onShown?.(vt);
    };
    img.src = url;
  }).catch(() => {});
}
// видео (p.video) или живое фото (p.live, fileId — отдельный ролик p.live) — нативные элементы
// управления возвращены ради ленты прокрутки (Грегори: «верни нативные элементы управления
// видео»), лишнее (своя кнопка play/pause, полный экран, троеточие) прячет CSS выше
function loadClip(p, fileId, mode) {
  host()?.myGalleryFull(fileId).then((url) => {
    if (photos[index] !== p) return;
    videoEl.dataset.mode = mode;
    videoEl.loop = false;
    // автозапуск сразу при показе — не нужно ловить мелкую кнопку плей; приглушаем только пока
    // пользователь ещё не включал звук сам (wantsSound выше) — иначе автозапуск без прямого
    // жеста (тик слайдшоу идёт из другого окна) браузер может молча заблокировать
    videoEl.muted = !wantsSound;
    // сброс позиции — тут, а не в обработчике "ended" (где он был раньше): там ролик ещё виден
    // на экране, и видимый скачок на первый кадр, пока грузится статика живого фото, выглядел
    // как сбой/зависание (Грегори, 2026-10-18: «сначала идёт видео, а затем фото этого кадра...
    // не стыкуется, вызывает сбой и остановки»). Нужен он всё равно — без него повторный play()
    // того же ролика (тот же src) иногда сразу стрелял "ended" заново, так и не начав играть
    videoEl.currentTime = 0;
    videoEl.src = url;
    suppressAlbumPauseSync = true;
    // показываем видео только когда у него реально есть декодированный кадр ("playing"), а не
    // сразу при вызове этой функции — раньше тут прятали фото и показывали видео ДО загрузки
    // (readyState 0), и экран на долю секунды оставался пустым/чёрным кадром: именно это Грегори
    // и видел как «передёргивание» на старте живого фото (2026-10-18). С этим гейтом можно вернуть
    // withTransition — крест-фейд идёт в уже готовый кадр видео, а не в пустоту, так что прежнее
    // «спотыкание» на видео (2026-10-16), ради которого переход раньше убрали совсем, тоже не
    // возвращается
    videoEl.addEventListener("playing", () => {
      if (photos[index] !== p) return;
      // ещё немного ждём СКРЫТЫМ после самого "playing" — декодер иногда даёт первые несколько
      // кадров не по порядку (переупорядочивание B-кадров), это и может выглядеть как «рывок» в
      // момент появления; на экране этого не видно, пока видео скрыто
      setTimeout(() => { if (photos[index] === p) revealVideoCrossfade(); }, 200);
    }, { once: true });
    // play() синхронно переводит paused в false ещё ДО реальной попытки запуска — если потом
    // автозапуск всё-таки не удастся (блокировка браузера, ошибка сети и т.п.), promise
    // отклонится, но событие pause при этом не случится, и нативная кнопка плей так и останется
    // «застрявшей» на паузе, хотя ролик не играет (Грегори, 2026-10-16: «кнопка плай не работает
    // с самого начала») — поэтому пересверяем реальное состояние уже ПОСЛЕ попытки, а не раньше.
    // если автозапуск со звуком браузер всё же заблокировал — откатываемся на приглушённый, иначе
    // ролик вообще не стартовал бы (play() отклонился, видео стоит на паузе)
    videoEl.play().then(syncMediaSession).catch(() => {
      if (!videoEl.muted) { videoEl.muted = true; suppressAlbumPauseSync = true; videoEl.play().then(syncMediaSession).catch(syncMediaSession); }
      else syncMediaSession();
    });
  }).catch(() => {});
}
// живое фото: сначала фото показывается полностью как обычное (loadPhoto, тот же переход,
// та же продолжительность — вызывается из showMine через onShown), и только когда оно уже
// провисело минимум столько же, сколько обычный переход (0.6с), запускаем ролик — даже если
// файл ролика был готов раньше, не срезаем это время (Грегори, 2026-10-18: «аккуратно с учетом
// задержки на покоз фото добавляем видео. Не режем время показа фото»). Дальше один переход
// фото → видео (на паузе на первом кадре), пауза-хват и play() тем же элементом
// алгоритм переписан с нуля (Грегори, 2026-10-18: «собери алгоритм заново, есть ошибка»):
// предыдущая версия показывала ролик НА ПАУЗЕ (первый кадр) до запуска play() — нативные
// элементы управления в такой момент рисуют крупную кнопку-треугольник в круге поверх кадра,
// и её появление/исчезание и давало «кружок, потом отскок». Поэтому теперь видео вообще не
// показываем на паузе: оно грузится и буферизуется скрытым, play() вызывается ДО переключения
// кадра, и только когда ролик реально пошёл (play() выполнился) — один переход фото → видео,
// уже играющее. Фото при этом не теряет время показа: ждём либо готовности ролика, либо 600мс
// (как обычный переход), смотря что дольше
function playLive(p, photoTransition) {
  const shownAt = performance.now();
  liveDebugReset();
  liveDebug("фото показано → просим файл ролика");
  host()?.myGalleryFull(p.live).then((url) => {
    if (photos[index] !== p) return;
    liveDebug("файл ролика получен, ставим src (скрыт)");
    videoEl.dataset.mode = "live";
    videoEl.loop = false;
    videoEl.muted = !wantsSound;
    videoEl.currentTime = 0;
    videoEl.src = url;
    suppressAlbumPauseSync = true;
    const revealPlaying = () => {
      if (photos[index] !== p) return;
      liveDebug("playing → ждём стабилизации декодера (скрыто)");
      // та же дополнительная скрытая пауза после "playing", что и у обычного видео (loadClip) —
      // даём декодеру отыграть возможное переупорядочивание первых кадров, пока это не видно
      setTimeout(() => {
        if (photos[index] !== p) return;
        liveDebug("переключаем фото → видео (уже играет)");
        revealVideoCrossfade();
        syncMediaSession();
      }, 200);
    };
    // ждём не резолв промиса play() (он может сработать ДО того, как декодер реально отдал
    // первый кадр — у крупных роликов это и давало «паузу, потом рывок» сразу после появления
    // видео), а событие "playing" — оно означает, что кадры уже реально идут. Обычное видео
    // (loadClip выше) всегда ждало именно "playing", и там этой паузы-рывка не было (Грегори,
    // 2026-10-18: «есть пауза и встряхивание в начале видео»)
    const startPlayback = () => {
      if (photos[index] !== p) return;
      liveDebug("ролик буферизован, вызываем play() (пока скрыт)");
      videoEl.addEventListener("playing", revealPlaying, { once: true });
      videoEl.play().catch(() => {
        if (!videoEl.muted) {
          videoEl.muted = true;
          suppressAlbumPauseSync = true;
          videoEl.play().catch(() => { videoEl.removeEventListener("playing", revealPlaying); syncMediaSession(); });
        } else { videoEl.removeEventListener("playing", revealPlaying); syncMediaSession(); }
      });
    };
    videoEl.addEventListener("canplaythrough", () => {
      if (photos[index] !== p) return;
      liveDebug("ролик готов проиграть без подгрузки");
      // не режем время показа фото — ждём, пока оно провисит хотя бы 600мс, даже если ролик
      // был готов раньше
      const wait = Math.max(0, 600 - (performance.now() - shownAt));
      setTimeout(() => {
        // и даже после этого ждём, пока переход САМОГО фото (его 600мс крест-фейд) правда
        // доиграет до конца — если запустить свой переход (фото → видео) чуть раньше, браузер
        // обрывает недоигравший первый переход на середине, это и давало рывок/передёргивание
        // сразу после появления видео (Грегори, 2026-10-18: «пауза, а затем передёргивание
        // туда-сюда»)
        Promise.resolve(photoTransition?.finished).catch(() => {}).then(() => {
          if (photos[index] === p) startPlayback();
        });
      }, wait);
    }, { once: true });
  }).catch(() => liveDebug("ОШИБКА получения файла ролика"));
}

// свой снимок: обычное фото, отдельный ролик (.MOV без пары) или живое фото — видео/живое фото
// запускаются сами, без клика (Грегори: «клик на видео или Live — проигрывать сразу»); разовое
// воспроизведение (пауза/повтор) — нативной кнопкой плей/пауза самого видео (Грегори, 2026-10-17:
// «кнопку [play-once] убираем» — она дублировала нативную кнопку и свою ленту прокрутки)
function showMine(p) {
  stageBadge.hidden = !p.live;
  // живое фото: сначала фото показывается ровно как обычное (тот же переход, та же
  // продолжительность — loadPhoto не трогаем), и только когда оно уже показано (onShown),
  // следом подключаем ролик через playLive — он сам не торопит переключение (см. playLive)
  if (p.video) loadClip(p, p.photo, "clip");
  else if (p.live) loadPhoto(p, false, (vt) => playLive(p, vt));
  else loadPhoto(p);
  afterShow(p);
  syncMediaSession();
}
// клавиши play/pause на клавиатуре и системная плашка «сейчас играет» (у Windows — своя, со
// своим значком) управляются через MediaSession API отдельно от видео-элемента — без явной
// настройки Chrome сам угадывает, какое видео сейчас «активное», и не сразу (Грегори,
// 2026-10-17: «звук при первом старте с клавиатуры не реагирует, потом реагирует», «значок
// проигрывателя не всегда совпадает с системным значком» — у системной плашки была СВОЯ логика,
// не привязанная к нашей кнопке). Держим playbackState и обработчики play/pause в точности
// синхронно с видео, чтобы оба значка всегда показывали одно и то же с самого первого кадра
function syncMediaSession() {
  if (!("mediaSession" in navigator)) return;
  if (videoEl.hidden) {
    navigator.mediaSession.playbackState = "none";
    navigator.mediaSession.setActionHandler("play", null);
    navigator.mediaSession.setActionHandler("pause", null);
    return;
  }
  navigator.mediaSession.metadata = new MediaMetadata({ title: photos[index]?.title || "Travel Earth" });
  navigator.mediaSession.playbackState = videoEl.paused ? "paused" : "playing";
  navigator.mediaSession.setActionHandler("play", () => videoEl.play().then(syncMediaSession).catch(syncMediaSession));
  navigator.mediaSession.setActionHandler("pause", () => videoEl.pause());
}
videoEl.addEventListener("play", syncMediaSession);
videoEl.addEventListener("pause", syncMediaSession);
// клик по самой кнопке плей/пауза нативной ленты управления видео (в отличие от клика по
// остальной площади кадра) не доходит всплытием до .stage (там общий переключатель паузы
// слайдшоу, см. ниже) — так что слайдшоу не узнавало о ручной паузе и преспокойно уезжало на
// следующий кадр, будто ролик никто не трогал (Грегори, 2026-10-17: «кнопка проигрывателя видео
// ведёт себя по-разному» при клике на плей альбома и клик на видео/фото). Подстраиваем paused
// альбома под реальное paused видео при каждом play/pause, кроме тех, что сделали мы сами
// (suppressAlbumPauseSync выше) — сверяем через albumPlayState(), а не слепо зовём
// albumPlayPause() (она лишь переключает, а не выставляет конкретное значение)
function syncAlbumPauseFromVideo() {
  if (suppressAlbumPauseSync) { suppressAlbumPauseSync = false; return; }
  // доигрывание ролика до конца тоже даёт событие "pause" (проверено: videoEl.ended уже true в
  // этот момент, раньше самого "ended") — это не ручная пауза, а естественное завершение, с ним
  // разбирается отдельно ended-обработчик ниже (albumClipEnded/restingOnPhoto); если принять его
  // здесь за ручную паузу, слайдшоу замирало бы на каждом живом фото/видео, не дождавшись своего
  // такта дальше
  if (videoEl.ended) return;
  if (!albumId) return;
  const st = host()?.albumPlayState?.();
  if (st && st.albumId === albumId && st.paused !== videoEl.paused) { host()?.albumPlayPause?.(); syncPlayer(); }
}
videoEl.addEventListener("play", syncAlbumPauseFromVideo);
videoEl.addEventListener("pause", syncAlbumPauseFromVideo);
// ролик (видео или живое фото) доиграл сам — живое фото возвращается к статичному снимку (без
// зацикливания, Грегори: «зацикливание Live — не хорошая идея»), обычное видео просто стоит на
// последнем кадре, готовое начаться заново по клику на нативную кнопку плей (currentTime сбрасываем, иначе
// play() на уже доигранном видео тут же снова сработал бы как "ended"); и в любом случае слайдшоу
// в главном окне узнаёт об этом напрямую (не через postMessage — то же окно, тот же источник) и
// само решает, идти ли дальше (если не на паузе) или просто остаться (Грегори: «проиграл — иди
// дальше»; «при выборе конкретного эпизода — проиграть и остановиться»)
videoEl.addEventListener("ended", () => {
  // Этап отладки «отскока» (Грегори, 2026-10-18: «сделай на живом фото сейчас только видео без
  // отскока, доиграл — пошёл дальше»): временно НЕ возвращаемся к статичному снимку по "ended" —
  // ролик доигрывает и альбом сразу едет дальше, точно как у обычного видео. Возврат на
  // полноценный отдельный показ статики (Грегори, 2026-10-17: «не проглатывай...») вернём, когда
  // убедимся, что сам конец ролика больше не дёргается
  if (videoEl.dataset.mode === "live") liveDebug("ended → едем дальше без возврата к статичному фото (этап)");
  syncMediaSession();
  if (albumId) host()?.albumClipEnded?.();
});

// плеер своего альбома сверху — те же назад/плей/дальше/стоп, что и в панели альбома в главном
// окне (PREV_ICON/PLAY_ICON/PAUSE_ICON/NEXT_ICON/STOP_ICON там же); тут просто те же рисунки
// (Грегори: «кнопки... должны повторять кнопки в панели альбома»)
// значки крупнее прежних — кнопки выросли до 40px (были 30px), а рисунки внутри раньше не
// подросли вместе с ними (Грегори, 2026-10-16: «размер кнопок нормальный, а иконки внутри мелкие»)
const PLAYER_PREV = `<svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>`;
const PLAYER_PLAY = `<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>`;
const PLAYER_PAUSE = `<svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>`;
const PLAYER_NEXT = `<svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>`;
const PLAYER_STOP = `<svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>`;
// остальной код (afterShow и т.п.) зовёт syncPlayer() безусловно — для не своих альбомов (нет
// albumId) это просто пустая функция
let syncPlayer = () => {};
if (albumId) {
  const bar = $(".player");
  bar.hidden = false;
  const playBtn = $(".player-play"), prevBtn = $(".player-prev"), nextBtn = $(".player-next"), stopBtn = $(".player-stop");
  syncPlayer = () => {
    const st = host()?.albumPlayState?.();
    const active = !!st && st.albumId === albumId;
    const playing = active && !st.paused;
    playBtn.innerHTML = playing ? PLAYER_PAUSE : PLAYER_PLAY;
    playBtn.classList.toggle("on", playing);
    playBtn.title = !active ? "Слайдшоу альбома" : st.paused ? "Продолжить" : "Пауза";
    prevBtn.disabled = nextBtn.disabled = stopBtn.disabled = !active;
  };
  playBtn.innerHTML = PLAYER_PLAY;
  prevBtn.innerHTML = PLAYER_PREV;
  nextBtn.innerHTML = PLAYER_NEXT;
  stopBtn.innerHTML = PLAYER_STOP;
  playBtn.addEventListener("click", () => {
    const st = host()?.albumPlayState?.();
    // передаём именно тот снимок, что сейчас открыт в этом окне — чтобы плей продолжил с него,
    // а не прыгнул на первый кадр альбома (Грегори: «клик сверху должен запускать видео/Live,
    // если хочу продолжить просмотр»)
    if (st && st.albumId === albumId) host()?.albumPlayPause?.(); else host()?.startAlbumPlay?.(albumId, photos[index].photo);
    syncPlayer();
  });
  prevBtn.addEventListener("click", () => { host()?.albumPlayGo?.(-1); syncPlayer(); });
  nextBtn.addEventListener("click", () => { host()?.albumPlayGo?.(1); syncPlayer(); });
  stopBtn.addEventListener("click", () => { host()?.stopAlbumPlay?.(); syncPlayer(); });
  syncPlayer();
}

// кнопка-подсказка — открыта всегда, а не только у альбомов (F11 полезен и для одиночного фото);
// клик по самой кнопке переключает банер, клик куда угодно ещё его закрывает
const infoBtn = $(".info-btn"), infoBanner = $(".info-banner");
infoBtn.addEventListener("click", () => { infoBanner.hidden = !infoBanner.hidden; });
document.addEventListener("click", (e) => {
  if (!infoBanner.hidden && !e.composedPath().includes(infoBtn) && !e.composedPath().includes(infoBanner)) infoBanner.hidden = true;
});

// карта в главном окне следит за текущим снимком (выделяет и подвигается к нему)
function tellMap(msg) {
  try { window.opener?.postMessage(msg, location.origin); } catch { /* главное окно закрыто */ }
}
addEventListener("pagehide", () => { clearInterval(playTimer); tellMap({ gallery: "closed" }); });
// галерея слайд-шоу аудиогида: новая остановка — новый список (перезагрузка), смена слайда —
// тот же снимок здесь (galleryShow)
addEventListener("message", (e) => {
  if (e.origin !== location.origin) return;
  if (e.data?.galleryReload) location.reload();
  // без проверки "индекс и правда другой" — иначе запуск/возврат на ролик, который уже показан
  // в этом окне (тот же кадр), молча ничего не делал, а видео/Live не запускались заново
  // (Грегори: «клик на верхней панели не запускает видео/LIVE, если хочу продолжить просмотр»)
  else if (Number.isInteger(e.data?.galleryShow)) show(e.data.galleryShow);
  else if (typeof e.data?.galleryPause === "boolean") {
    // плей/пауза нажали в панели альбома главного окна — ролик на экране ставим на паузу/
    // продолжаем вместе со слайдшоу (Грегори: «при нажатии на плей крутить слайдшоу с этого
    // места дальше»); обычное фото просто ждёт своей очереди — там нечего ставить на паузу
    if (!videoEl.hidden) {
      suppressAlbumPauseSync = true;
      if (e.data.galleryPause) videoEl.pause(); else videoEl.play().then(syncMediaSession).catch(syncMediaSession);
    }
    syncPlayer();
  }
});
if (data.stop) document.title = `${data.stop} — Travel Earth`;

// переход внутри самого окна галереи (стрелки/миниатюры/клавиши) — в отличие от навигации по
// сообщению извне (galleryShow выше), держит плеер альбома в главном окне в курсе места, но не
// отправляет сообщение обратно в это же окно (кадр тут и так уже показан); слайдшоу при этом не
// останавливается — если играло, играет дальше с нового места (Грегори, 2026-10-17: «убрать
// остановку при клике на фото»)
function navTo(i) {
  show(i);
  if (albumId) host()?.albumJumpTo?.(index);
}
$(".prev").addEventListener("click", () => navTo(index - 1));
$(".next").addEventListener("click", () => navTo(index + 1));
// клик по самому кадру больше не переключает паузу слайдшоу (Грегори, 2026-10-18: «пауза при
// клике убираем везде... сейчас пауза срабатывает при нажатии на полосе прокрутки видео») —
// клик по нативной полосе прокрутки видео (часть .stage) всплывал сюда и гасил альбом; кнопки
// паузы остаются в плеере, их достаточно
$(".play-toggle").addEventListener("click", () => {
  const on = !playTimer;
  clearInterval(playTimer);
  playTimer = on ? setInterval(() => show(index + 1), 5000) : null;
  $(".play-toggle").classList.toggle("on", on);
  $(".play-toggle").textContent = on ? "❚❚" : "▶";
  $(".play-toggle").title = on ? "Пауза" : "Слайд-шоу: смена каждые 5 с";
});
// после F11 выход из полноэкранного режима шлёт сюда тот же Esc, что и закрытие окна — без
// этой защиты выход из полного экрана заодно закрывал галерею (Грегори, 2026-10-16: «после F11
// выход Esc не должен закрывать окно», и ещё раз: «Esc выкидывает из альбома» — таймер-эвристика
// (resize в последние 500мс) была гонкой: сам Esc браузер обрабатывает (выходит из fullscreen)
// АСИНХРОННО, resize от этого выхода приходит ПОСЛЕ keydown, а не до — так что lastResize к
// моменту проверки ещё старый, и условие ошибочно считало, что это не F11. Сравнение
// innerWidth/innerHeight с screen.width/height тоже оказалось ненадёжным — на развёрнутом
// (не F11) окне без видимой панели задач размеры совпадали со экраном один в один, и Esc
// переставал закрывать совсем (Грегори, 2026-10-16: «Esc перестал работать совсем»). Chrome/Edge
// сами знают, показана ли своя рамка/вкладки — доверяем медиа-фиче display-mode: fullscreen
// вместо подсчёта пикселей вручную; запасной вариант — на случай браузера без этой медиа-фичи
function isFullscreen() {
  // document.fullscreenElement — двойной клик по video.photo сам, без единой строчки нашего кода,
  // включает нативный полный экран этого элемента (Chrome/Edge умеют так для <video>) — то самое
  // «Esc/курсор вверху» с крестиком, что видел Грегори: это Fullscreen API, а не F11 (см.
  // комментарий у markRecentFullscreenExit ниже — там разбор, почему в это не верилось раньше)
  if (document.fullscreenElement) return true;
  const mq = window.matchMedia("(display-mode: fullscreen)");
  if (mq.media !== "not all") return mq.matches;
  return window.innerWidth >= screen.width - 2 && window.innerHeight >= screen.height - 2;
}
// окно без системной рамки занимает весь физический экран (обычный Maximize — нет, там остаётся
// место под панель задач) — в этом режиме прячем ленту миниатюр, чтобы фото/видео занимало весь
// экран (Грегори, 2026-10-16: «в режиме F11 убери ленту фотографий»)
function syncFullscreen() {
  $(".thumbs").hidden = isFullscreen();
}
// альбомная ориентация (.stage шире, чем выше) — сужаем и центрируем нативную панель controls по
// ширине реально видимой картинки, а не по ширине всего элемента video (см. CSS-комментарий у
// .stage.landscape video.photo::-webkit-media-controls-panel выше); в книжной ориентации класс не
// ставим — там панель на всю ширину видео и так нормально выглядит (Грегори, 2026-10-16: «в
// книжной панель всегда по ширине видео»)
function syncVideoControlsWidth() {
  const stage = $(".stage");
  if (!stage) return;
  const landscape = stage.clientWidth > stage.clientHeight;
  stage.classList.toggle("landscape", landscape);
  if (!landscape || !videoEl.videoWidth || !videoEl.videoHeight) return;
  const stageAspect = stage.clientWidth / stage.clientHeight;
  const videoAspect = videoEl.videoWidth / videoEl.videoHeight;
  // та же математика, что у object-fit: contain — ширина картинки без чёрных полей
  const contentWidth = stageAspect > videoAspect ? stage.clientHeight * videoAspect : stage.clientWidth;
  videoEl.style.setProperty("--controls-w", `${Math.round(contentWidth)}px`);
}
videoEl.addEventListener("loadedmetadata", syncVideoControlsWidth);
window.addEventListener("resize", syncVideoControlsWidth);
window.addEventListener("resize", syncFullscreen);
syncFullscreen();
syncVideoControlsWidth();
// два РАЗНЫХ полноэкранных режима шлют сюда тот же Esc, что и закрытие окна — без этой защиты
// выход из любого из них заодно закрывал галерею. F11 — переключатель рамки окна браузера, тут
// сигнал о смене — медиа-фича display-mode (на ней и строится isFullscreen() выше). Но у
// Грегори воспроизводилось НЕ через F11, а через двойной клик по video.photo — Chrome/Edge сами
// включают Fullscreen API для видео по такому клику, без единого requestFullscreen() в нашем
// коде (отсюда и баннер «переместите мышь вверх или нажмите Esc», который видел Грегори, 2026-10-17:
// «вот что я вижу каждый раз») — и именно поэтому прошлая версия, проверявшая
// document.fullscreenElement/fullscreenchange, когда-то работала: это НАСТОЯЩИЙ сигнал для ЭТОГО
// случая, а не «неправильный API», как раньше решили здесь по ошибке. Слушаем оба сигнала —
// fullscreenchange (видео) и change у matchMedia (F11)
let recentlyExitedFullscreen = false;
function markRecentFullscreenExit() {
  if (!isFullscreen()) {
    recentlyExitedFullscreen = true;
    setTimeout(() => { recentlyExitedFullscreen = false; }, 400);
  }
}
document.addEventListener("fullscreenchange", markRecentFullscreenExit);
const fsQuery = window.matchMedia("(display-mode: fullscreen)");
if (fsQuery.media !== "not all") fsQuery.addEventListener("change", markRecentFullscreenExit);
else window.addEventListener("resize", markRecentFullscreenExit);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") navTo(index - 1);
  else if (e.key === "ArrowRight") navTo(index + 1);
  else if (e.key === "Home") navTo(0);
  else if (e.key === "End") navTo(photos.length - 1);
  else if (e.key === "Escape") {
    if (isFullscreen() || recentlyExitedFullscreen) return;
    window.close();
  }
  // стрелка вверх — плей/пауза альбома, то же самое, что клик по кнопке плей в плеере (Грегори,
  // 2026-10-18: «добавь стрелку вверх на клавиатуре, тогда я смогу управлять альбомом только
  // стрелками» — слева/справа уже листают, не хватало способа запустить/остановить без мыши)
  else if (e.key === "ArrowUp" && albumId) {
    e.preventDefault();
    const st = host()?.albumPlayState?.();
    if (st && st.albumId === albumId) host()?.albumPlayPause?.(); else host()?.startAlbumPlay?.(albumId, photos[index].photo);
    syncPlayer();
  }
});
$(".thumbs").addEventListener("wheel", (e) => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) $(".thumbs").scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });

// экскурсия альбома: заголовки, абзацы и «остановки» — снимок с подписью, щелчок открывает его
const tour = data.excursion;
if (tour) {
  const panel = $(".tour");
  const byName = new Map(photos.map((p, i) => [p.title.toLowerCase(), i]));
  panel.append(Object.assign(document.createElement("h2"), { textContent: tour.title }));
  for (const b of tour.blocks) {
    if (b.type === "h") panel.append(Object.assign(document.createElement("h3"), { textContent: b.text }));
    else if (b.type === "p") panel.append(Object.assign(document.createElement("p"), { textContent: b.text }));
    else {
      const i = byName.get(b.file.toLowerCase());
      if (i === undefined) continue;
      const stop = Object.assign(document.createElement("button"), { className: "stop" });
      stop.dataset.photo = photos[i].photo;
      const img = Object.assign(document.createElement("img"), { alt: "" });
      if (photos[i].thumb) img.src = photos[i].thumb;
      else host()?.myGalleryThumb(photos[i].photo).then((url) => { img.src = url; }).catch(() => {});
      stop.append(img, Object.assign(document.createElement("span"), { textContent: b.text || b.file }));
      stop.addEventListener("click", () => navTo(i));
      panel.append(stop);
    }
  }
  const toggle = $(".tour-toggle");
  toggle.hidden = false;
  const setTour = (on) => { panel.hidden = !on; toggle.classList.toggle("on", on); localStorage.setItem("travel-earth.tour", on ? "1" : "0"); };
  toggle.addEventListener("click", () => setTour(panel.hidden));
  setTour(localStorage.getItem("travel-earth.tour") !== "0");
}

if (photos.length) show(index);
else { $(".stage").replaceChildren(Object.assign(document.createElement("div"), { className: "empty", textContent: "Нет снимков" })); $(".play-toggle").hidden = true; }
</script>
</body>
</html>
